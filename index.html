<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="light dark" />
  <title>Dance Lessons Calendar</title>
  <link rel="icon" type="image/x-icon" href="master_icon.jpg">

  <!-- FullCalendar v6 injects its own stylesheet from the JS bundle;
       there is no separate index.global.min.css file to load. -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="page-header">
  <h1>Dance Lessons Calendar</h1>
</header>

<div class="toolbar">
  <div id="coachLegend" class="coach-legend"></div>

  <div id="filterControls" class="filter-controls">
    <span class="filter-label">Filter</span>
    <div class="select-wrap">
      <select id="coachFilter" class="filter-select" aria-label="Filter by coach">
        <option value="">All Coaches</option>
      </select>
    </div>
    <div class="select-wrap">
      <select id="typeFilter" class="filter-select" aria-label="Filter by lesson type">
        <option value="">All Types</option>
      </select>
    </div>
  </div>
</div>

<div id="calendar"></div>

<!-- ===== Lesson modal ===== -->
<div id="lessonModal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
  <div class="modal-backdrop"></div>

  <div class="modal-content">
    <div class="modal-head">
      <h2 id="modalTitle">Add lesson</h2>
      <button type="button" id="closeModal" class="icon-btn" aria-label="Close">&times;</button>
    </div>

    <div class="modal-body">
      <div class="field">
        <label class="field-label" for="lessonTitle">Lesson name</label>
        <input id="lessonTitle" type="text" placeholder="e.g. Salsa basics" autocomplete="off">
      </div>

      <div class="field">
        <span class="field-label">Coaches</span>
        <div id="coachChips" class="chip-group"></div>
      </div>

      <div class="field">
        <span class="field-label">Lesson type</span>
        <div id="typeSegment" class="segmented"></div>
      </div>

      <div class="field-row">
        <div class="field">
          <label class="field-label" for="lessonDate">Date</label>
          <input type="date" id="lessonDate">
        </div>
        <div class="field">
          <label class="field-label" for="lessonTime">Start time</label>
          <input type="time" id="lessonTime">
        </div>
      </div>

      <div class="switch-row">
        <label class="switch">
          <input type="checkbox" id="repeatWeekly">
          <span class="switch-track"><span class="switch-thumb"></span></span>
        </label>
        <label class="switch-text" for="repeatWeekly">Repeat every week</label>
      </div>

      <div id="repeatEndDateLabel" class="field collapsible hidden">
        <label class="field-label" for="repeatEndDate">Repeat until <span class="muted">(optional)</span></label>
        <input type="date" id="repeatEndDate">
      </div>

      <div id="conflictNotice" class="notice hidden" role="status" aria-live="polite">
        <span class="notice-icon"></span>
        <div class="notice-body">
          <strong class="notice-title"></strong>
          <p class="notice-text"></p>
        </div>
      </div>

      <div id="bulkEditOptions" class="bulk-edit-panel hidden">
        <p>Changes apply to <strong>this week only</strong>. To change this and every week after it:</p>
        <button type="button" id="editAllFutureBtn" class="btn accent">Edit all future</button>
      </div>
    </div>

    <div class="modal-buttons">
      <button id="saveLesson" class="btn primary">
        <span class="btn-label">Save</span>
        <span class="spinner" aria-hidden="true"></span>
      </button>
      <button id="deleteLesson" class="btn danger hidden">Delete</button>
      <button id="cancelLesson" class="btn ghost">Cancel</button>
    </div>
  </div>
</div>

<button id="addLessonBtn" class="floating-btn" aria-label="Add lesson">
  <span class="fab-plus"></span>
</button>

<div id="toastHost" class="toast-host" aria-live="polite" aria-atomic="false"></div>
<div id="dialogHost"></div>

<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js"></script>

<script type="module" src="firebase.js"></script>
<script type="module" src="app.js"></script>

</body>
</html>
