<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="light dark" />
  <title>Dance Lessons Calendar</title>
  <link rel="icon" type="image/x-icon" href="master_icon.jpg">

  <!-- Resolve the theme before the first paint, otherwise a dark-mode user
       gets a white flash while the deferred module scripts load. -->
  <script>
    (function () {
      var theme = "light";
      try {
        var saved = localStorage.getItem("theme");
        theme = (saved === "light" || saved === "dark")
          ? saved
          : (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      } catch (e) { /* private mode / storage blocked — fall back to light */ }
      document.documentElement.setAttribute("data-theme", theme);
    })();
  </script>

  <!-- FullCalendar v6 injects its own stylesheet from the JS bundle;
       there is no separate index.global.min.css file to load. -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="page-header">
  <h1>Dance Lessons Calendar</h1>
</header>

<div class="toolbar">
  <div id="coachLegend" class="coach-legend"></div>

  <div id="filterControls" class="filter-controls">
    <span class="filter-label">Filter</span>
    <div class="select-wrap">
      <select id="coachFilter" class="filter-select" aria-label="Filter by coach">
        <option value="">All Coaches</option>
      </select>
    </div>
    <div class="select-wrap">
      <select id="typeFilter" class="filter-select" aria-label="Filter by lesson type">
        <option value="">All Types</option>
      </select>
    </div>

    <button id="statsBtn" class="stats-btn" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true">
        <path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>
      </svg>
      <span>Stats</span>
    </button>

    <button id="themeToggle" class="theme-toggle" type="button"
            role="switch" aria-checked="false" aria-label="Switch to dark mode">
      <span class="theme-toggle-thumb" aria-hidden="true">
        <span class="theme-icon sun">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round">
            <circle cx="12" cy="12" r="4.5" fill="currentColor" stroke="none"/>
            <path d="M12 1.5v2M12 20.5v2M3.4 3.4l1.4 1.4M19.2 19.2l1.4 1.4M1.5 12h2M20.5 12h2M3.4 20.6l1.4-1.4M19.2 4.8l1.4-1.4"/>
          </svg>
        </span>
        <span class="theme-icon moon">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path d="M21 12.79A9 9 0 1 1 11.21 3a7 7 0 0 0 9.79 9.79z"/>
          </svg>
        </span>
      </span>
    </button>
  </div>
</div>

<div id="calendar"></div>

<!-- ===== Lesson modal ===== -->
<div id="lessonModal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
  <div class="modal-backdrop"></div>

  <div class="modal-content">
    <div class="modal-head">
      <h2 id="modalTitle">Add lesson</h2>
      <button type="button" id="closeModal" class="icon-btn" aria-label="Close">&times;</button>
    </div>

    <div class="modal-body">
      <div class="field">
        <label class="field-label" for="lessonTitle">Student</label>
        <input id="lessonTitle" type="text" placeholder="Type a name, or pick below" autocomplete="off">
        <div id="studentPicker" class="student-picker"></div>
      </div>

      <div class="field">
        <span class="field-label">Coaches</span>
        <div id="coachChips" class="chip-group"></div>
      </div>

      <div class="field">
        <span class="field-label">Lesson type</span>
        <div id="typeSegment" class="segmented"></div>
      </div>

      <div class="field-row">
        <div class="field">
          <label class="field-label" for="lessonDate">Date</label>
          <input type="date" id="lessonDate">
        </div>
        <div class="field">
          <label class="field-label" for="lessonTime">Start time</label>
          <input type="time" id="lessonTime" min="09:00" max="22:00">
        </div>
      </div>

      <div class="switch-row">
        <label class="switch">
          <input type="checkbox" id="repeatWeekly">
          <span class="switch-track"><span class="switch-thumb"></span></span>
        </label>
        <label class="switch-text" for="repeatWeekly">Repeat every week</label>
      </div>

      <div id="repeatEndDateLabel" class="field collapsible hidden">
        <label class="field-label" for="repeatEndDate">Repeat until <span class="muted">(optional)</span></label>
        <input type="date" id="repeatEndDate">
      </div>

      <div id="conflictNotice" class="notice hidden" role="status" aria-live="polite">
        <span class="notice-icon"></span>
        <div class="notice-body">
          <strong class="notice-title"></strong>
          <p class="notice-text"></p>
        </div>
      </div>

      <div id="bulkEditOptions" class="bulk-edit-panel hidden">
        <p>Changes apply to <strong>this week only</strong>. To change this and every week after it:</p>
        <button type="button" id="editAllFutureBtn" class="btn accent">Edit all future</button>
      </div>
    </div>

    <div class="modal-buttons">
      <button id="saveLesson" class="btn primary">
        <span class="btn-label">Save</span>
        <span class="spinner" aria-hidden="true"></span>
      </button>
      <button id="deleteLesson" class="btn danger hidden">Delete</button>
      <button id="cancelLesson" class="btn ghost">Cancel</button>
    </div>
  </div>
</div>

<!-- ===== Monthly stats ===== -->
<div id="statsModal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="statsTitle">
  <div class="modal-backdrop"></div>

  <div class="modal-content stats-content">
    <div class="modal-head">
      <h2 id="statsTitle">Lesson stats</h2>
      <button type="button" id="closeStats" class="icon-btn" aria-label="Close">&times;</button>
    </div>

    <div class="stats-monthbar">
      <button type="button" id="statsPrev" class="month-nav" aria-label="Previous month">&lsaquo;</button>
      <span id="statsMonthLabel" class="stats-month-label"></span>
      <button type="button" id="statsNext" class="month-nav" aria-label="Next month">&rsaquo;</button>
    </div>

    <div id="statsSummary" class="stats-summary"></div>

    <div id="statsTabs" class="stats-tabs" role="tablist">
      <button type="button" class="stats-tab active" data-tab="coach" role="tab">By coach</button>
      <button type="button" class="stats-tab" data-tab="student" role="tab">By student</button>
      <button type="button" class="stats-tab" data-tab="roster" role="tab">Students</button>
    </div>

    <div id="statsBody" class="modal-body stats-body"></div>
  </div>
</div>

<button id="addLessonBtn" class="floating-btn" aria-label="Add lesson">
  <span class="fab-plus"></span>
</button>

<div id="toastHost" class="toast-host" aria-live="polite" aria-atomic="false"></div>
<div id="dialogHost"></div>

<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js"></script>

<script type="module" src="firebase.js"></script>
<script type="module" src="app.js"></script>

</body>
</html>
